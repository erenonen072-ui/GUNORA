
<!DOCTYPE html>
<html lang="tr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>GÜNORA Haber</title>

  <meta
    name="description"
    content="GÜNORA haber detay sayfası"
  >

  <link
    rel="stylesheet"
    href="/css/style.css"
  >

  <style>

    .article {
      background: white;
      padding: 35px;
      border-radius: 10px;
      margin: 35px auto;
      max-width: 900px;
    }

    .article-category {
      color: #e31b23;
      font-weight: 800;
      font-size: 13px;
      text-transform: uppercase;
    }

    .article h1 {
      font-size: clamp(30px, 5vw, 48px);
      line-height: 1.08;
      margin: 12px 0 18px;
    }

    .article-summary {
      color: #5f6368;
      font-size: 19px;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .article-meta {
      color: #777;
      font-size: 13px;
      border-bottom: 1px solid #eee;
      padding-bottom: 20px;
      margin-bottom: 25px;
    }

    .article-image {
      width: 100%;
      display: block;
      border-radius: 8px;
      margin-bottom: 30px;
    }

    .article-content {
      font-size: 18px;
      line-height: 1.8;
      white-space: pre-wrap;
    }

    .article-error {
      text-align: center;
      padding: 100px 20px;
    }

    @media(max-width:600px) {

      .article {
        padding: 20px;
        margin-top: 15px;
      }

      .article-content {
        font-size: 16px;
      }

    }

  </style>

</head>


<body>


<header class="main-header">

  <div class="container header-inner">

    <a
      href="/"
      class="logo"
    >
      GÜN<span>ORA</span>
    </a>

    <a href="/">
      ← Ana Sayfa
    </a>

  </div>

</header>


<main class="container">

  <article
    id="article"
    class="article"
  >

    <div class="article-error">
      Haber yükleniyor...
    </div>

  </article>

</main>


<script>

async function loadArticle() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  const id =
    params.get("id");

  const article =
    document.getElementById("article");


  if (!id) {

    article.innerHTML = `
      <div class="article-error">
        <h1>Haber bulunamadı</h1>
        <p>Geçerli bir haber seçilmedi.</p>
      </div>
    `;

    return;

  }


  try {

    const response =
      await fetch(
        `/api/news/${encodeURIComponent(id)}`
      );


    if (!response.ok) {
      throw new Error();
    }


    const news =
      await response.json();


    document.title =
      `${news.title} — GÜNORA`;


    article.innerHTML = `

      <div class="article-category">
        ${escapeHTML(news.category)}
      </div>

      <h1>
        ${escapeHTML(news.title)}
      </h1>

      ${
        news.summary
          ? `
            <div class="article-summary">
              ${escapeHTML(news.summary)}
            </div>
          `
          : ""
      }

      <div class="article-meta">

        ${formatDate(news.created_at)}

        ·

        👁
        ${Number(news.views || 0)
          .toLocaleString("tr-TR")}

        ·

        ${escapeHTML(news.author || "GÜNORA")}

      </div>


      ${
        news.image
          ? `
            <img
              class="article-image"
              src="${escapeAttribute(news.image)}"
              alt="${escapeAttribute(news.title)}"
            >
          `
          : ""
      }


      <div class="article-content">
        ${escapeHTML(news.content)}
      </div>

    `;

  }

  catch {

    article.innerHTML = `
      <div class="article-error">

        <h1>
          Haber bulunamadı
        </h1>

        <p>
          Haber silinmiş veya mevcut değil.
        </p>

        <br>

        <a href="/">
          ← Ana sayfaya dön
        </a>

      </div>
    `;

  }

}


function formatDate(date) {

  return new Date(date)
    .toLocaleString(
      "tr-TR",
      {
        day: "2-digit",
        month: "long",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      }
    );

}


function escapeHTML(value) {

  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


function escapeAttribute(value) {

  return escapeHTML(value);

}


loadArticle();

</script>


</body>

</html>
