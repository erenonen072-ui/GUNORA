<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Haber — GÜNORA PRO</title>

  <meta
    name="description"
    content="GÜNORA PRO güncel haberler"
  >

  <meta
    property="og:title"
    content="GÜNORA PRO"
  >

  <meta
    property="og:description"
    content="Gündemin Yeni Sesi"
  >

  <meta
    property="og:type"
    content="article"
  >

  <link
    rel="stylesheet"
    href="/style.css"
  >
</head>

<body>

  <!-- OKUMA İLERLEME ÇUBUĞU -->
  <div
    id="readingProgress"
    class="reading-progress"
  ></div>

  <!-- ÜST BAR -->
  <div class="topbar">
    <div class="container topbar-inner">

      <div class="topbar-left">
        GÜNDEMİN YENİ SESİ
      </div>

      <div
        class="live-clock"
        id="liveClock"
      ></div>

    </div>
  </div>

  <!-- HEADER -->
  <header class="site-header">

    <div class="container header-inner">

      <a
        href="/"
        class="logo"
        aria-label="GÜNORA PRO Ana Sayfa"
      >
        <span class="logo-main">
          GÜNORA
        </span>

        <span class="logo-pro">
          PRO
        </span>
      </a>

      <div class="header-actions">

        <button
          class="icon-button"
          id="themeToggle"
          type="button"
          aria-label="Tema değiştir"
        >
          ◐
        </button>

        <button
          class="menu-button"
          id="menuToggle"
          type="button"
          aria-label="Menüyü aç"
        >
          ☰
        </button>

      </div>

    </div>

  </header>

  <!-- NAV -->
  <nav
    class="main-nav"
    id="mainNav"
  >

    <div class="container nav-inner">

      <a href="/">
        Ana Sayfa
      </a>

      <a href="/?kategori=Gündem">
        Gündem
      </a>

      <a href="/?kategori=Spor">
        Spor
      </a>

      <a href="/?kategori=Ekonomi">
        Ekonomi
      </a>

      <a href="/?kategori=Teknoloji">
        Teknoloji
      </a>

      <a href="/?kategori=Dünya">
        Dünya
      </a>

    </div>

  </nav>

  <!-- HABER -->
  <main>

    <div class="container">

      <a
        href="/"
        class="back-home"
      >
        ← Ana Sayfaya Dön
      </a>

      <div
        id="article"
        class="article-layout"
      >

        <!-- Haber buraya gelecek -->

      </div>

    </div>

  </main>

  <!-- FOOTER -->
  <footer class="site-footer">

    <div class="container footer-inner">

      <div>
        <strong>GÜNORA PRO</strong>
        <p>
          Gündemin Yeni Sesi
        </p>
      </div>

      <div class="footer-links">

        <a href="/">
          Ana Sayfa
        </a>

        <a href="/404.html">
          404
        </a>

      </div>

    </div>

  </footer>

  <!-- HABER VERİTABANI -->
  <script src="/data/news.js"></script>

  <script>

    /* =====================================================
       VERİTABANI
    ===================================================== */

    const NEWS =
      Array.isArray(window.GUNORA_NEWS)
        ? window.GUNORA_NEWS
        : [];


    /* =====================================================
       SLUG OKUMA
    ===================================================== */

    function getSlug(){

      const params =
        new URLSearchParams(
          window.location.search
        );

      const querySlug =
        params.get("slug");

      if(querySlug){

        return decodeURIComponent(
          querySlug
        );

      }


      const path =
        window.location.pathname;

      const parts =
        path
          .split("/")
          .filter(Boolean);


      if(
        parts[0] === "haber" &&
        parts[1]
      ){

        return decodeURIComponent(
          parts[1]
        );

      }


      return null;

    }


    /* =====================================================
       HABER BUL
    ===================================================== */

    function findArticle(){

      const slug =
        getSlug();

      if(!slug){
        return null;
      }

      return NEWS.find(
        article =>
          String(article.slug) ===
          String(slug)
      ) || null;

    }


    /* =====================================================
       GÖRÜNTÜLENME
    ===================================================== */

    function increaseView(article){

      if(!article){
        return;
      }

      const key =
        "gunora_view_" +
        article.id;

      if(
        sessionStorage.getItem(key)
      ){
        return;
      }

      article.views =
        Number(article.views || 0) + 1;

      sessionStorage.setItem(
        key,
        "1"
      );

    }


    /* =====================================================
       POPÜLER HABERLER
    ===================================================== */

    function renderPopular(){

      const articles =
        [...NEWS]
          .sort(
            (a,b) =>
              Number(b.views || 0) -
              Number(a.views || 0)
          )
          .slice(0,5);


      return `
        <aside class="sidebar">

          <div class="section-heading">
            <h2>
              Çok Okunanlar
            </h2>
          </div>

          <div class="popular-list">

            ${
              articles.map(
                (item,index) => `

                  <a
                    class="popular-item"
                    href="/haber/${encodeURIComponent(item.slug)}"
                  >

                    <span class="popular-number">
                      ${index + 1}
                    </span>

                    <span class="popular-content">

                      <strong>
                        ${escapeHTML(item.title)}
                      </strong>

                      <small>
                        ${escapeHTML(item.category || "Gündem")}
                      </small>

                    </span>

                  </a>

                `
              ).join("")
            }

          </div>

        </aside>
      `;

    }


    /* =====================================================
       HTML GÜVENLİĞİ
    ===================================================== */

    function escapeHTML(value){

      return String(value ?? "")
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    /* =====================================================
       TARİH
    ===================================================== */

    function formatDate(date){

      if(!date){
        return "";
      }

      const d =
        new Date(date);

      if(
        Number.isNaN(
          d.getTime()
        )
      ){

        return "";

      }

      return new Intl.DateTimeFormat(
        "tr-TR",
        {
          day: "2-digit",
          month: "long",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        }
      ).format(d);

    }


    /* =====================================================
       PAYLAŞ
    ===================================================== */

    function createShareButtons(article){

      const url =
        window.location.href;

      const title =
        article.title || "GÜNORA PRO";


      const encodedURL =
        encodeURIComponent(url);

      const encodedTitle =
        encodeURIComponent(title);


      return `

        <div class="share-box">

          <strong>
            Haberi Paylaş
          </strong>

          <div class="share-buttons">

            <a
              href="https://wa.me/?text=${encodedTitle}%20${encodedURL}"
              target="_blank"
              rel="noopener"
              class="share-button"
            >
              WhatsApp
            </a>

            <a
              href="https://twitter.com/intent/tweet?text=${encodedTitle}&url=${encodedURL}"
              target="_blank"
              rel="noopener"
              class="share-button"
            >
              X
            </a>

            <button
              type="button"
              class="share-button"
              onclick="copyArticleURL()"
            >
              Linki Kopyala
            </button>

          </div>

        </div>

      `;

    }


    /* =====================================================
       LINK KOPYALA
    ===================================================== */

    function copyArticleURL(){

      const url =
        window.location.href;


      if(
        navigator.clipboard &&
        navigator.clipboard.writeText
      ){

        navigator.clipboard
          .writeText(url)
          .then(() => {

            alert(
              "Haber bağlantısı kopyalandı."
            );

          })
          .catch(() => {

            fallbackCopy(url);

          });

      }else{

        fallbackCopy(url);

      }

    }


    function fallbackCopy(text){

      const textarea =
        document.createElement("textarea");

      textarea.value =
        text;

      textarea.style.position =
        "fixed";

      textarea.style.opacity =
        "0";

      document.body.appendChild(
        textarea
      );

      textarea.select();

      try{

        document.execCommand(
          "copy"
        );

        alert(
          "Haber bağlantısı kopyalandı."
        );

      }catch(error){

        alert(
          "Bağlantı kopyalanamadı."
        );

      }

      textarea.remove();

    }


    /* =====================================================
       404
    ===================================================== */

    function render404(){

      document.title =
        "Haber Bulunamadı — GÜNORA PRO";


      const article =
        document.getElementById(
          "article"
        );


      article.innerHTML = `

        <div class="article-not-found">

          <div class="not-found-number">
            404
          </div>

          <h1>
            Haber bulunamadı
          </h1>

          <p>
            Aradığınız haber mevcut değil
            veya kaldırılmış olabilir.
          </p>

          <a
            href="/"
            class="primary-button"
          >
            Ana Sayfaya Dön
          </a>

        </div>

      `;

    }


    /* =====================================================
       HABERİ GÖSTER
    ===================================================== */

    function renderArticle(article){

      if(!article){

        render404();

        return;

      }


      increaseView(article);


      document.title =
        article.title +
        " — GÜNORA PRO";


      const articleContainer =
        document.getElementById(
          "article"
        );


      const imageHTML =
        article.image
          ? `
            <img
              class="article-cover"
              src="${escapeHTML(article.image)}"
              alt="${escapeHTML(article.title)}"
            >
          `
          : `
            <div
              class="article-cover image-placeholder"
              aria-label="Haber görseli"
            >
              GÜNORA PRO
            </div>
          `;


      articleContainer.innerHTML = `

        <article class="article-main">

          <div class="article-category">

            ${escapeHTML(
              article.category ||
              "Gündem"
            )}

          </div>


          <h1 class="article-title">

            ${escapeHTML(
              article.title
            )}

          </h1>


          <p class="article-summary">

            ${escapeHTML(
              article.summary || ""
            )}

          </p>


          <div class="article-meta">

            <span>
              ${escapeHTML(
                article.author ||
                "GÜNORA"
              )}
            </span>

            <span>
              •
            </span>

            <time datetime="${escapeHTML(
              article.created_at || ""
            )}">
              ${formatDate(
                article.created_at
              )}
            </time>

            <span>
              •
            </span>

            <span>
              👁 ${Number(
                article.views || 0
              )}
            </span>

          </div>


          ${imageHTML}


          <div class="article-content">

            ${
              article.content ||
              "<p>Haber içeriği bulunamadı.</p>"
            }

          </div>


          ${createShareButtons(article)}

        </article>


        ${renderPopular()}

      `;

    }


    /* =====================================================
       TEMA
    ===================================================== */

    const themeToggle =
      document.getElementById(
        "themeToggle"
      );


    if(
      localStorage.getItem(
        "gunora_dark"
      ) === "1"
    ){

      document.body.classList.add(
        "dark"
      );

    }


    themeToggle?.addEventListener(
      "click",
      () => {

        document.body.classList.toggle(
          "dark"
        );


        localStorage.setItem(
          "gunora_dark",
          document.body.classList.contains(
            "dark"
          )
            ? "1"
            : "0"
        );

      }
    );


    /* =====================================================
       MOBİL MENÜ
    ===================================================== */

    const menuToggle =
      document.getElementById(
        "menuToggle"
      );

    const mainNav =
      document.getElementById(
        "mainNav"
      );


    menuToggle?.addEventListener(
      "click",
      () => {

        mainNav?.classList.toggle(
          "open"
        );

      }
    );


    /* =====================================================
       SAAT
    ===================================================== */

    function updateClock(){

      const clock =
        document.getElementById(
          "liveClock"
        );


      if(!clock){
        return;
      }


      const now =
        new Date();


      clock.textContent =
        now.toLocaleTimeString(
          "tr-TR",
          {
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit"
          }
        );

    }


    updateClock();

    setInterval(
      updateClock,
      1000
    );


    /* =====================================================
       OKUMA İLERLEMESİ
    ===================================================== */

    window.addEventListener(
      "scroll",
      () => {

        const progress =
          document.getElementById(
            "readingProgress"
          );


        if(!progress){
          return;
        }


        const scrollTop =
          window.scrollY;


        const documentHeight =
          document.documentElement
            .scrollHeight -
          window.innerHeight;


        const percentage =
          documentHeight > 0
            ? (
                scrollTop /
                documentHeight
              ) * 100
            : 0;


        progress.style.width =
          percentage + "%";

      }
    );


    /* =====================================================
       BAŞLAT
    ===================================================== */

    const article =
      findArticle();


    renderArticle(
      article
    );

  </script>

</body>
</html>
