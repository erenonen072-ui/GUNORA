<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ekonomi Haberleri | GÜNORA</title>
  <meta name="description" content="GÜNORA Ekonomi - Türkiye ve dünyadan güncel ekonomi haberleri.">

  <link rel="stylesheet" href="/style.css">

  <style>
    .category-page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px 70px;
    }

    .category-header {
      margin-bottom: 30px;
      padding-bottom: 18px;
      border-bottom: 3px solid #111;
    }

    .category-header h1 {
      margin: 0;
      font-size: 38px;
      font-weight: 800;
    }

    .category-header p {
      margin: 8px 0 0;
      color: #777;
      font-size: 16px;
    }

    .category-news {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
    }

    .category-card {
      display: block;
      text-decoration: none;
      color: inherit;
      background: var(--card, #fff);
      border: 1px solid rgba(0,0,0,.08);
      border-radius: 14px;
      overflow: hidden;
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .category-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 30px rgba(0,0,0,.10);
    }

    .category-card-image {
      height: 190px;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffd21c;
      font-size: 28px;
      font-weight: 800;
    }

    .category-card-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .category-card-body {
      padding: 18px;
    }

    .category-card-category {
      display: inline-block;
      font-size: 12px;
      font-weight: 800;
      color: #111;
      background: #ffd21c;
      padding: 5px 9px;
      border-radius: 6px;
      margin-bottom: 10px;
    }

    .category-card h2 {
      margin: 0 0 9px;
      font-size: 20px;
      line-height: 1.3;
    }

    .category-card p {
      margin: 0;
      color: #777;
      line-height: 1.5;
      font-size: 14px;
    }

    .category-empty {
      padding: 50px 20px;
      text-align: center;
      color: #777;
      grid-column: 1 / -1;
    }

    @media (max-width: 850px) {
      .category-news {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      .category-page {
        padding: 25px 15px 50px;
      }

      .category-header h1 {
        font-size: 30px;
      }

      .category-news {
        grid-template-columns: 1fr;
      }

      .category-card-image {
        height: 210px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="container">
      <a href="/" class="logo">GÜNORA</a>

      <nav>
        <a href="/">Ana Sayfa</a>
        <a href="/gundem.html">Gündem</a>
        <a href="/spor.html">Spor</a>
        <a href="/ekonomi.html" class="active">Ekonomi</a>
        <a href="/dunya.html">Dünya</a>
        <a href="/teknoloji.html">Teknoloji</a>
      </nav>
    </div>
  </header>

  <main class="category-page">

    <div class="category-header">
      <h1>💰 Ekonomi Haberleri</h1>
      <p>Türkiye ve dünyadan en güncel ekonomi haberleri</p>
    </div>

    <section class="category-news" id="categoryNews">
      <div class="category-empty">
        Haberler yükleniyor...
      </div>
    </section>

  </main>

  <footer>
    <div class="container">
      <p>© 2026 GÜNORA — Güncel Haberlerin Adresi</p>

      <div>
        <a href="/hakkimizda.html">Hakkımızda</a>
        <a href="/iletisim.html">İletişim</a>
        <a href="/gizlilik.html">Gizlilik Politikası</a>
        <a href="/kullanim-sartlari.html">Kullanım Şartları</a>
      </div>
    </div>
  </footer>

  <script src="/data/news.js"></script>

  <script>
    const articles = Array.isArray(window.GUNORA_NEWS)
      ? window.GUNORA_NEWS
      : [];

    const container = document.getElementById("categoryNews");

    const economy = articles.filter(article =>
      String(article.category || "").toLowerCase() === "ekonomi"
    );

    if (!economy.length) {
      container.innerHTML = `
        <div class="category-empty">
          <h2>Ekonomi haberi bulunamadı.</h2>
          <p>Yeni ekonomi haberleri eklendiğinde burada görünecek.</p>
        </div>
      `;
    } else {
      container.innerHTML = economy.map(article => {

        const image = article.image
          ? `<img src="${article.image}" alt="${article.title}" loading="lazy">`
          : `<span>GÜNORA</span>`;

        return `
          <a class="category-card"
             href="/haber/${article.slug || article.id}">

            <div class="category-card-image">
              ${image}
            </div>

            <div class="category-card-body">

              <span class="category-card-category">
                EKONOMİ
              </span>

              <h2>${article.title || "Başlıksız haber"}</h2>

              <p>${article.summary || ""}</p>

            </div>

          </a>
        `;
      }).join("");
    }
  </script>

</body>
</html>
